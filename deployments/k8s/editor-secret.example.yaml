# Documentation only. Use scripts/provision-editor.py; never apply this example.
apiVersion: v1
kind: Secret
metadata:
  name: netriun-editor-secret
  namespace: netriun
type: Opaque
stringData:
  POSTGRES_PASSWORD: REPLACE_LOCALLY
  DATABASE_URL: postgres://netriun:REPLACE_LOCALLY@netriun-editor-postgres:5432/netriun?sslmode=disable
  ADMIN_PASSWORD_HASH: REPLACE_WITH_BCRYPT_HASH
  # Optional SMTP settings: ports 587 (STARTTLS) and 465 (TLS) are supported.
  # SMTP_HOST: smtp.example.com
  # SMTP_PORT: "587"
  # SMTP_USERNAME: REPLACE_LOCALLY
  # SMTP_PASSWORD: REPLACE_LOCALLY
  # SMTP_FROM: s.amrei@netriun.com
