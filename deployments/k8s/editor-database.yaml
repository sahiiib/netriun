apiVersion: v1
kind: PersistentVolume
metadata:
  name: netriun-editor-postgres-pv
spec:
  capacity:
    storage: 5Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /var/lib/netriun-web/postgresql
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [k8s-node01]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: netriun-editor-postgres
  namespace: netriun
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: netriun-editor-postgres-pv
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: netriun-editor-postgres
  namespace: netriun
spec:
  selector:
    app: netriun-editor-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netriun-editor-postgres
  namespace: netriun
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: netriun-editor-postgres
  template:
    metadata:
      labels:
        app: netriun-editor-postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_DB
              value: netriun
            - name: POSTGRES_USER
              value: netriun
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: netriun-editor-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: [pg_isready, -U, netriun, -d, netriun]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, -U, netriun, -d, netriun]
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: netriun-editor-postgres
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: netriun-editor-postgres
  namespace: netriun
spec:
  podSelector:
    matchLabels:
      app: netriun-editor-postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: netriun-web
        - podSelector:
            matchLabels:
              app: netriun-editor-backup
      ports:
        - protocol: TCP
          port: 5432
