<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Netriun Editor</title><link rel="stylesheet" href="/neditport2065/admin.css"><script defer src="/neditport2065/admin.js"></script></head>
<body><header><a href="/" class="brand">NETRIUN <span>Editor</span></a><a href="/" target="_blank" rel="noopener">View site ↗</a></header>
<main><section id="login-panel" class="login panel"><p class="eyebrow">CONTENT WORKSPACE</p><h1>Welcome back.</h1><p>Sign in to manage your website.</p><form id="login-form"><label>Username<input name="username" autocomplete="username" required value="admin"></label><label>Password<input name="password" type="password" autocomplete="current-password" required maxlength="72"></label><button>Sign in</button></form></section>
<section id="workspace" hidden><div class="toolbar"><div><p class="eyebrow">CONTENT WORKSPACE</p><h1>Make it yours.</h1></div><div class="actions"><button id="reload" class="secondary">Reload content</button><button id="logout" class="secondary">Sign out</button><button id="save">Save changes</button></div></div>
<nav aria-label="Editor sections" id="tabs"><button data-tab="products">Products</button><button data-tab="news">News</button><button data-tab="about">About</button><button data-tab="partners">Partners</button><button data-tab="settings">Contact settings</button><button data-tab="messages">Inbox</button></nav>
<div class="editor-heading"><h2 id="section-title">Products</h2><label id="language-label">Content language<select id="language"><option value="en">English</option><option value="de">Deutsch</option><option value="ru">Русский</option><option value="hy">Հայերեն</option></select></label></div><p id="language-note">English is required. Other languages fall back to English when left blank.</p><div id="editor"></div><button id="add" class="secondary">+ Add item</button>
</section><p id="notice" role="status" aria-live="polite"></p></main><footer>Netriun · Bamshi LLC · Yerevan, Armenia</footer></body></html>
