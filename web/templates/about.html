{{define "content"}}

<section class="page">

<p class="eyebrow" data-i18n="about.eyebrow">Company</p>
<h1 data-i18n="about.title">About Netriun</h1>

<p class="page-lead">{{local .Content.About.Lead}}</p>

<section class="brand-ownership glass-panel" aria-labelledby="ownership-heading">
    <h2 id="ownership-heading" data-i18n="about.ownershipTitle">Brand ownership</h2>
    <p>{{local .Content.About.Ownership}}</p>
</section>

<div class="about-grid">
    <div class="glass-panel">
        <h2 data-i18n="about.missionTitle">Our mission</h2>
        <p>{{local .Content.About.Mission}}</p>
    </div>

    <div class="glass-panel">
        <h2 data-i18n="about.approachTitle">Our approach</h2>
        <p>{{local .Content.About.Approach}}</p>
    </div>
</div>

</section>

{{end}}
