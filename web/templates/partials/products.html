{{define "product-grid"}}
<div class="product-grid">
{{range .Content.Products}}{{if ne .Status "draft"}}
    <article class="product-card">
        {{if .Image}}<img src="{{.Image}}" alt="" class="card-icon" loading="lazy">{{end}}
        <h2>{{if and (eq .Status "published") .URL}}<a class="product-link" href="{{.URL}}">{{local .Name}} <span aria-hidden="true">↗</span></a>{{else}}{{local .Name}}{{end}}</h2>
        {{if eq .Status "coming-soon"}}<span class="product-status" data-i18n="products.comingSoon">Coming soon</span>{{end}}
        <p class="content-text">{{local .Description}}</p>
    </article>
{{end}}{{end}}
</div>
{{end}}
